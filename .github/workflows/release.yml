name: Release (build + sign + publish)

# Builds the single-file, self-contained AutoRokScheduler.exe, signs it with
# Azure Trusted Signing, verifies the signature, and attaches it to the GitHub
# Release for the tag.
#
# Triggers:
#   - pushing a version tag (v*), e.g. `git tag v1.0.1 && git push origin v1.0.1`
#   - manually via Actions -> "Run workflow" (enter an existing tag, e.g. v1.0.0,
#     to (re)build and sign it — handy to sign a release that predates this workflow)
#
# Required configuration (see docs/CODE_SIGNING.md for how to obtain these):
#   Secrets (Settings -> Secrets and variables -> Actions -> Secrets):
#     AZURE_TENANT_ID          service-principal tenant (directory) id
#     AZURE_CLIENT_ID          service-principal application (client) id
#     AZURE_CLIENT_SECRET      service-principal client secret
#   Variables (same page -> Variables):
#     TRUSTED_SIGNING_ENDPOINT your account URI, e.g. https://wus2.codesigning.azure.net/
#     TRUSTED_SIGNING_ACCOUNT  Trusted Signing account name
#     TRUSTED_SIGNING_PROFILE  certificate profile name

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build, sign, and release (e.g. v1.0.0)'
        required: true

permissions:
  contents: write   # create/update the GitHub Release and upload the asset

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Checkout at the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish single-file self-contained exe
        shell: pwsh
        run: >
          dotnet publish AutoRokScheduler/AutoRokScheduler.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o publish

      - name: Sign with Azure Trusted Signing
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}/publish
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com/
          timestamp-digest: SHA256

      - name: Verify Authenticode signature
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature "publish/AutoRokScheduler.exe"
          $sig | Format-List
          if ($sig.Status -ne 'Valid') { throw "Signature is not Valid: $($sig.Status)" }
          Write-Host "Signed by: $($sig.SignerCertificate.Subject)"

      - name: Attach signed exe to the Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: publish/AutoRokScheduler.exe
          fail_on_unmatched_files: true
